<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INSECT MBTI | 나만의 곤충 부캐 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;
      color: #1f3329;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.85), transparent 32%),
        linear-gradient(145deg, #eef6e9, #dcebd7);
    }

    main {
      width: min(100%, 560px);
      padding: 52px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(56, 91, 67, 0.12);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(39, 75, 50, 0.14);
    }

    .label {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #42614d;
      background: #edf5e9;
      border-radius: 999px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 10vw, 64px);
      line-height: 1;
      letter-spacing: -0.04em;
      color: #243c2c;
    }

    h2 {
      margin: 14px 0 24px;
      font-size: clamp(22px, 6vw, 30px);
      line-height: 1.35;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      font-size: 17px;
      line-height: 1.75;
      color: #617067;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
    }

    .dots span {
      width: 9px;
      height: 9px;
      background: #8fab91;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 70%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      35% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dots span {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="label">국립과천과학관 곤충생태관</div>

    <h1>INSECT MBTI</h1>
    <h2>나만의 곤충 부캐 찾기</h2>

    <p>
      곤충의 날 기념 특별 이벤트를 준비하고 있습니다.<br>
      곧 새로운 모습으로 만나요!
    </p>

    <div class="dots" aria-label="준비 중">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
</body>
</html>
